<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AK DevOps Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 50px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 15px;
      border-radius: 12px;
      width: 250px;
      text-align: center;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
    }

    .status {
      color: #22c55e;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>🚀 AK DevOps CI/CD Dashboard</header>

<div class="container">

  <div class="card">
    <h2>Pipeline</h2>
    <p class="status">SUCCESS</p>
  </div>

  <div class="card">
    <h2>Docker</h2>
    <p class="status">Built & Pushed</p>
  </div>

  <div class="card">
    <h2>ECS Service</h2>
    <p class="status">Running</p>
  </div>

  <div class="card">
    <h2>Load Balancer</h2>
    <p class="status">Active</p>
  </div>

</div>

</body>
</html>
